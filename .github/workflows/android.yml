name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and Test Calculator App
        if: hashFiles('apps/calculator/gradlew') != ''
        run: |
          cd apps/calculator
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - name: Build and Test Gallery App
        if: hashFiles('apps/gallery/gradlew') != ''
        run: |
          cd apps/gallery
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - name: Build and Test Browser App (:app & :lite)
        if: hashFiles('apps/browser/gradlew') != ''
        run: |
          cd apps/browser
          chmod +x gradlew
          ./gradlew test :app:assembleDebug :lite:assembleDebug --stacktrace

      - name: Build and Test Comms App
        if: hashFiles('apps/comms/gradlew') != ''
        run: |
          cd apps/comms
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - name: Build and Test Banking App
        if: hashFiles('apps/banking/gradlew') != ''
        run: |
          cd apps/banking
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

